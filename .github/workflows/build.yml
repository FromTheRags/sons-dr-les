name: Build & Package

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SDL3 & SDL3_ttf
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          version-sdl-ttf: 3-latest
          install-linux-dependencies: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build project
        run: cmake --build build --config Release

      - name: Package Linux Artifact
        run: |
          mkdir -p dist/sons-droles-linux
          cp build/sons-droles dist/sons-droles-linux/
          cp -r assets dist/sons-droles-linux/
          cp LICENSE OFL.txt README.md dist/sons-droles-linux/
          cd dist && tar -czvf ../sons-droles-linux-x86_64.tar.gz sons-droles-linux

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sons-droles-linux-x86_64
          path: sons-droles-linux-x86_64.tar.gz

  build-windows:
    name: Windows (MinGW-w64 & Inno Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-ttf

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Package Windows Portable Zip
        shell: msys2 {0}
        run: |
          mkdir -p dist/sons-droles-windows
          cp build/sons-droles.exe dist/sons-droles-windows/
          cp -r assets dist/sons-droles-windows/
          cp LICENSE OFL.txt README.md dist/sons-droles-windows/
          cmake -DEXECUTABLE="$PWD/build/sons-droles.exe" -DDESTINATION="$PWD/dist/sons-droles-windows" -DMINGW_BIN_DIR=/mingw64/bin -P cmake/CopyRuntimeDependencies.cmake
          cd dist && cmake -E tar cf ../sons-droles-windows-x64.zip --format=zip sons-droles-windows

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc 'innosetup/sons_droles.iss'

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sons-droles-windows-x64
          path: sons-droles-windows-x64.zip

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sons-droles-installer
          path: dist/sons-droles-setup-*.exe
